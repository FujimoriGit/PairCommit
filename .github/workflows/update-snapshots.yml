name: Update VRT Baselines

# 基準画像はここでしか record しない。手元の Mac と CI ではアンチエイリアスが
# 一致しないため、記録する環境を1つに固定する。
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      # GITHUB_TOKEN で push すると、更新された PR のワークフローが承認待ちになる。
      # deploy key で push すればそのまま走る。
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.VRT_DEPLOY_KEY }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      # 基準画像がないテストは record したうえで失敗するので、失敗を握って画像だけ拾う
      - name: Record
        run: |
          rm -rf PairCommitTests/__Snapshots__
          ./Scripts/test.sh || true

      # record に10分近くかかる間にブランチが進むことがある。録った画像を
      # そのときの先端に載せ替えてから push する。画像は録り直したものが正しいので、
      # 先端側に画像の変更があっても録ったほうで置き換える。
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          recorded="$RUNNER_TEMP/recorded-snapshots"
          rm -rf "$recorded"
          cp -R PairCommitTests/__Snapshots__ "$recorded"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            rm -rf PairCommitTests/__Snapshots__
            cp -R "$recorded" PairCommitTests/__Snapshots__
            git add PairCommitTests/__Snapshots__

            if git diff --cached --quiet; then
              echo "基準画像に変更なし"
              exit 0
            fi

            git commit -m "VRT の基準画像を CI で record し直す"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "先端が動いたので載せ替えて再試行する（$attempt 回目）"
          done
          exit 1
