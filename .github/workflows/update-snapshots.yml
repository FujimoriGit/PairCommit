name: Update VRT Baselines

# 既存の基準画像を撮り直すのはここだけ（ci.yml が撮るのは基準画像のないものだけ）。
# 手元の Mac と CI ではアンチエイリアスが一致しないため、記録する環境を CI に固定する。
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      # 基準画像を push するのに deploy key が要る。GITHUB_TOKEN で push しても、
      # 再帰実行を防ぐ仕組みで、そのコミットに対するワークフローは起動しない。
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.VRT_DEPLOY_KEY }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      # 基準画像がないテストは record したうえで失敗するので、失敗を握って画像だけ拾う
      - name: Record
        run: |
          rm -rf PairCommitTests/__Snapshots__
          ./Scripts/test.sh || true

      - name: Commit
        run: ./Scripts/commit-snapshots.sh "$GITHUB_REF_NAME" replace "VRT の基準画像を CI で record し直す"
