name: Deploy to TestFlight

on:
  push:
    branches: [main]
    # アプリの中身に関わらないものだけを挙げる。書き忘れても、同じ中身のビルドが1つ増えるだけ。
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/**'
      - '.prefire.yml'
      - 'Scripts/**'
      - 'LocalPackage/Tests/**'
      - 'PairCommitTests/**'
      - 'PairCommitUITests/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # ci.yml で確かめたのと同じ Xcode でビルドする。上げるときは両方を揃える。
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      # 開発用証明書のないランナーでは、Automatic signing の archive が証明書を作ろうとして失敗する。
      # Xcode Cloud と同じく archive は仮の署名で済ませ、配布用の署名は export の cloud signing に任せる。
      - name: Archive
        run: |
          xcodebuild \
            -scheme PairCommit \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/PairCommit.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      # cloud signing で配布用の証明書を発行させるには、Admin ロールの API キーが要る。
      - name: Upload
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>676WN4U5D4</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/PairCommit.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
