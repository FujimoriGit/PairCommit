name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: false
          use_sticky_comment: true
          prompt: |
            この PR の差分をレビューしてください。指摘は該当する行へのインラインコメントとして残し、
            全体の所感だけを PR コメントに書いてください。
            CLAUDE.md の設計原則・コーディング規約・テスト原則に反する箇所を最優先で見てください。
            ドメインに触れる差分では design.md も読み、決定事項と食い違っていないか見てください。
            CI が判定すること（ビルド・テスト・lint の成否）は指摘しないでください。
            問題がなければその旨だけを短く投稿してください。
          claude_args: |
            --model claude-opus-5
            --allowedTools Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment
