name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            この PR の差分をレビューして、指摘を PR コメントとして投稿してください。
            CLAUDE.md の設計原則・コーディング規約・テスト原則に反する箇所を最優先で見てください。
            CI が判定すること（ビルド・テスト・lint の成否）は指摘しないでください。
            問題がなければその旨だけを短く投稿してください。
          claude_args: |
            --model claude-opus-5
