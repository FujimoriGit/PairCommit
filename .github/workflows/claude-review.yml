name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # main を取り込んだだけの push でも synchronize は来る。PR 自身の差分が
      # 変わっていなければ、レビューする対象がない。
      - id: diff
        env:
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          changed=true
          if [ "$ACTION" = synchronize ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            before=$(git diff "$(git merge-base "$BASE" "$BEFORE")" "$BEFORE" | git hash-object --stdin)
            after=$(git diff "$(git merge-base "$BASE" "$AFTER")" "$AFTER" | git hash-object --stdin)
            [ "$before" = "$after" ] && changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.diff.outputs.changed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          classify_inline_comments: false
          use_sticky_comment: true
          prompt: |
            この PR の差分をレビューしてください。指摘は該当する行へのインラインコメントとして残し、
            全体の所感だけを PR コメントに書いてください。
            CLAUDE.md の設計原則・コーディング規約・テスト原則に反する箇所を最優先で見てください。
            ドメインに触れる差分では design.md も読み、決定事項と食い違っていないか見てください。
            CI が判定すること（ビルド・テスト・lint の成否）は指摘しないでください。
            問題がなければその旨だけを短く投稿してください。
            投稿の前に、この PR に自分が付けた未解決のインラインコメントを全て読んでください。
            すでに指摘済みの内容は、言い回しや根拠を変えたものも含めて再投稿しないでください。
            すでに直っているものは GitHub の GraphQL API の resolveReviewThread で解決済みにしてください。
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh api:*),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"

      # sticky が更新するのは1つだけで、それ以外に残っているまとめは以後どの実行も
      # 触らない。今回の実行のコメントだけ残す。
      - name: Delete stale review comments
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "claude[bot]") | select((.body // "") | contains(env.RUN_URL) | not) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done
