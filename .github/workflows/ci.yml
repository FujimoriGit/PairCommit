name: App Build & VRT

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build-vrt:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ビルドにも撮る画像にも関わらないものだけを挙げる。ここに書き忘れても
      # VRT が走るだけで、見逃しにはならない。
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          ignored='(\.md$|^\.claude/|^\.github/workflows/(claude-review|unit-tests|update-snapshots)\.yml$)'
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE "$ignored"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      # ランナーの既定 Xcode はイメージ更新で上がり、そのたびに VRT の基準画像がずれる。
      # 上げるときは update-snapshots で基準画像を record し直すこと。
      - name: Select Xcode
        if: steps.filter.outputs.app == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build & VRT
        if: steps.filter.outputs.app == 'true'
        run: ./Scripts/test.sh

      # スナップショット差分は xcresult の添付画像で確認できる
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
