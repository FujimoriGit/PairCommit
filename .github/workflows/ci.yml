name: App Build & VRT

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # ランナーの既定 Xcode はイメージ更新で上がり、そのたびに VRT の基準画像がずれる。
      # 上げるときは update-snapshots で基準画像を record し直すこと。
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build & VRT
        run: ./Scripts/test.sh

      # スナップショット差分は xcresult の添付画像で確認できる
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
