name: App Build & VRT

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          pattern='^(PairCommit/|PairCommitTests/|PairCommitUITests/|LocalPackage/|Packages/|Scripts/|PairCommit\.xcodeproj/|\.prefire\.yml|\.swiftlint\.yml|\.github/workflows/ci\.yml)'
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE "$pattern"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # このジョブ名が必須チェックなので、差分がなくても走らせて成功を報告する必要がある。
    # macOS ランナーを取るのは実際にビルドするときだけにする。
    runs-on: ${{ needs.changes.outputs.app == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v4

      # ランナーの既定 Xcode はイメージ更新で上がり、そのたびに VRT の基準画像がずれる。
      # 上げるときは update-snapshots で基準画像を record し直すこと。
      - name: Select Xcode
        if: needs.changes.outputs.app == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build & VRT
        if: needs.changes.outputs.app == 'true'
        run: ./Scripts/test.sh

      # スナップショット差分は xcresult の添付画像で確認できる
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
